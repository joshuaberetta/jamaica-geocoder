[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths = tests tests_django
# The Flask suite under tests/ imports web_app; the Django suite under
# tests_django/ uses DRF APIClient. pytest-django sets up a sqlite test DB
# (DATABASE_URL must be unset when running tests) for the auth/token tables;
# the managed=False spatial models are mocked, never queried for real.
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
