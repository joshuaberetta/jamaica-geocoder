name: humanitarian-geocoder
region: nyc
domains:
  - domain: geocoder.kobolabs.dev
    type: PRIMARY
services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      branch: main
      deploy_on_push: true
      repo: <YOUR_GITHUB_USERNAME>/<YOUR_REPO_NAME>
    
    http_port: 5000
    
    instance_count: 1
    instance_size_slug: basic-xxs
    
    envs:
      - key: GOOGLE_MAPS_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DJANGO_SUPERUSER_USERNAME
        scope: RUN_TIME
        value: "admin"
      - key: DJANGO_SUPERUSER_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: DJANGO_DEBUG
        scope: RUN_TIME
        value: "false"
      - key: ALLOWED_HOSTS
        scope: RUN_TIME
        value: "*"
    
    health_check:
      http_path: /health
      initial_delay_seconds: 40
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    
    routes:
      - path: /
