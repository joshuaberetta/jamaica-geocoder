name: humanitarian-geocoder
region: nyc
domains:
  - domain: geocoder.kobolabs.dev
    type: PRIMARY

# Heavy one-time boundary download + global ingest runs here, to completion,
# BEFORE the web service starts. Pre-deploy jobs have no HTTP health check, so
# the long ingest can't trip the web readiness probe. Idempotent: once cod_adm
# holds admin levels 0-3, later deploys check-and-skip in seconds.
jobs:
  - name: ingest
    kind: PRE_DEPLOY
    dockerfile_path: Dockerfile
    source_dir: /
    run_command: sh scripts/ingest_job.sh
    instance_count: 1
    instance_size_slug: basic-xs
    github:
      branch: beta
      deploy_on_push: true
      repo: kobotoolbox/geocoder
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      branch: beta
      deploy_on_push: true
      repo: kobotoolbox/geocoder
    
    http_port: 5000
    
    instance_count: 1
    instance_size_slug: basic-xs
    
    envs:
      - key: GOOGLE_MAPS_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: DJANGO_SUPERUSER_USERNAME
        scope: RUN_TIME
        value: "admin"
      - key: DJANGO_SUPERUSER_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: DJANGO_DEBUG
        scope: RUN_TIME
        value: "false"
      - key: ALLOWED_HOSTS
        scope: RUN_TIME
        value: "*"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

    health_check:
      http_path: /health
      initial_delay_seconds: 40
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    
    routes:
      - path: /
